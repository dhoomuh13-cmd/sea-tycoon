<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Tycoon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Header / Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }
        .menu-btn {
            background: none;
            border: none;
            color: #f8fafc;
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
        }
        .app-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Sidebar Slide Menu (Pojok Kiri) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #111827;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            transition: left 0.3s ease-in-out;
            z-index: 1000;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1f2937;
        }
        .sidebar.open {
            left: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }
        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 22px;
            cursor: pointer;
        }
        .menu-category {
            font-size: 12px;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 10px;
            margin-top: 15px;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .sidebar-item {
            padding: 12px 16px;
            color: #e5e7eb;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 6px;
            background: #1f2937;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar-item:hover {
            background: #374151;
            color: #38bdf8;
        }
        
        /* Overlay Backdrop */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            backdrop-filter: blur(3px);
        }
        .overlay.active {
            display: block;
        }

        /* Main Content Area (Kosong Bersih Sesuai Permintaan) */
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px;
            text-align: center;
        }
        .welcome-placeholder {
            color: #475569;
            font-size: 14px;
        }

        /* Navigasi Bawah (Besar & Bulat Kapsul) */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 12px 10px;
            border-radius: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            z-index: 90;
        }
        .nav-item {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .nav-item span-icon {
            font-size: 20px;
        }
        .nav-item.active, .nav-item:hover {
            color: #0f172a;
            background: #38bdf8;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }

        /* Modal Popup Pemberitahuan */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1100;
        }
        .modal-content {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            width: 85%;
            max-width: 300px;
            border: 1px solid #334155;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .modal-content button {
            margin-top: 18px;
            padding: 10px 20px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Top Bar dengan Tombol Hamburger Menu (Garis Tiga) -->
    <div class="top-bar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="app-title">Sea Tycoon</div>
    </div>

    <!-- Overlay Backdrop Sidebar -->
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar Menu Geser (Slide) -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span>Menu Utama</span>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>

        <div class="menu-category">Downloader</div>
        <div class="sidebar-item" onclick="selectMenu('TikTok Downloader')">🎵 Tiktok</div>
        <div class="sidebar-item" onclick="selectMenu('Instagram Downloader')">📸 Instagram</div>

        <div class="menu-category">Bermain Game</div>
        <div class="sidebar-item" onclick="selectMenu('Block Blast')">🎮 Block Blast</div>
    </div>

    <!-- Halaman Utama (Bersih tanpa teks sambutan mengganggu) -->
    <div class="main-content">
        <div class="welcome-placeholder">Pilih menu di bawah atau geser menu dari pojok kiri atas.</div>
    </div>

    <!-- Navigasi Bawah (Besar, Bentuk Kapsul/Bulat Modern) -->
    <div class="bottom-nav">
        <a class="nav-item active" onclick="switchTab(this, 'Beranda')">
            <span style="font-size: 18px;">🏠</span>
            <span>Beranda</span>
        </a>
        <a class="nav-item" onclick="switchTab(this, 'Kotak Masuk')">
            <span style="font-size: 18px;">📥</span>
            <span>Kotak Masuk</span>
        </a>
        <a class="nav-item" onclick="switchTab(this, 'Profile')">
            <span style="font-size: 18px;">👤</span>
            <span>Profile</span>
        </a>
    </div>

    <!-- Modal Popup Pemberitahuan -->
    <div id="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-bottom: 8px; color: #38bdf8;">Informasi</h3>
            <p id="modal-text" style="color: #94a3b8; font-size: 14px; line-height: 1.4;">Fitur sedang dalam perbaikan / akan segera hadir!</p>
            <button onclick="closePopup()">Tutup</button>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function switchTab(element, name) {
            // Ubah status active navigasi bawah
            let items = document.querySelectorAll('.bottom-nav .nav-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');

            if (name !== 'Beranda') {
                showPopup(`Menu ${name}`);
            }
        }

        function selectMenu(menuName) {
            toggleSidebar();
            showPopup(menuName);
        }

        function showPopup(feature) {
            document.getElementById('modal-text').innerText = `${feature} sedang dalam perbaikan / fitur mendatang!`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
