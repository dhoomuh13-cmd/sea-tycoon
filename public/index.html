<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEXUS BACK ERA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Overlay dibuat sangat tipis (0.2) agar background gambar aslinya terlihat terang dan jelas */
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('file_0000000090a88211a683eb1fe52aeca8.png') no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden;
            min-height: 100vh;
            color: #f8fafc;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- LOADING AWAL -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-4 bg-slate-950 transition-opacity duration-800">
        <div class="text-center z-10 mb-4">
            <span class="text-5xl animate-bounce">👑</span>
            <div class="bg-slate-900/90 backdrop-blur-md px-6 py-2.5 rounded-3xl shadow-xl border-2 border-red-500 mt-3">
                <h1 class="text-2xl font-black tracking-wide text-white">
                    LEXUS BACK ERA
                </h1>
            </div>
        </div>
    </div>

    <!-- KONTEN UTAMA (KOSONG / SIAP DIGANTI) -->
    <div class="text-center relative z-10">
        <!-- Area ini bersih, background poster akan tampil full dan terang tanpa terhalang kotak dashboard -->
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                loadingScreen.classList.add('fade-out');
                setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);
            }, 1000);
        });
    </script>
</body>
</html>
