<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Tycoon - TikTok Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 100;
        }
        .menu-btn {
            background: none; border: none; color: #f8fafc; font-size: 24px; cursor: pointer; margin-right: 15px;
        }
        .app-title { font-size: 18px; font-weight: 600; }

        /* Sidebar */
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: #111827; box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            transition: left 0.3s ease-in-out; z-index: 1000; padding: 20px;
            display: flex; flex-direction: column; border-right: 1px solid #1f2937;
        }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; font-size: 18px; font-weight: bold; color: #38bdf8; }
        .close-btn { background: none; border: none; color: #9ca3af; font-size: 22px; cursor: pointer; }
        .menu-category { font-size: 12px; text-transform: uppercase; color: #6b7280; margin: 15px 0 10px; font-weight: 700; letter-spacing: 1px; }
        .sidebar-item { padding: 12px 16px; color: #e5e7eb; text-decoration: none; border-radius: 10px; margin-bottom: 6px; background: #1f2937; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .sidebar-item:hover { background: #374151; color: #38bdf8; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; backdrop-filter: blur(3px); }
        .overlay.active { display: block; }

        /* Main Content Area */
        .main-content {
            flex: 1; padding: 90px 20px 100px; overflow-y: auto; max-width: 600px; margin: 0 auto; width: 100%;
        }

        /* Downloader Box Style */
        .downloader-card {
            background: #1e293b; padding: 24px; border-radius: 20px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center;
        }
        .downloader-card h2 { font-size: 20px; margin-bottom: 8px; color: #f8fafc; }
        .downloader-card p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input {
            width: 100%; padding: 14px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 12px; color: #fff; font-size: 14px; outline: none;
        }
        .input-group input:focus { border-color: #38bdf8; }
        .download-btn {
            width: 100%; padding: 14px; background: #38bdf8; border: none; border-radius: 12px; color: #0f172a; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s;
        }
        .download-btn:hover { background: #0ea5e9; }

        /* Loading & Result Section */
        #loading { display: none; margin-top: 20px; color: #38bdf8; font-size: 14px; }
        .spinner {
            width: 24px; height: 24px; border: 3px solid rgba(56,189,248,0.3); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #result-box { display: none; margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid #334155; text-align: left; }
        #result-box video { width: 100%; border-radius: 8px; margin-top: 10px; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: #1e293b; display: flex; justify-content: space-around;
            padding: 12px 10px; border-radius: 35px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); border: 1px solid #334155; z-index: 90;
        }
        .nav-item { color: #94a3b8; text-decoration: none; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 8px 20px; border-radius: 20px; transition: 0.3s; }
        .nav-item.active, .nav-item:hover { color: #0f172a; background: #38bdf8; font-weight: 600; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="app-title" id="page-title">Sea Tycoon</div>
    </div>

    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span>Menu Utama</span>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="menu-category">Downloader</div>
        <div class="sidebar-item" onclick="loadPage('tiktok')">🎵 Tiktok</div>
        <div class="sidebar-item" onclick="loadPage('instagram')">📸 Instagram</div>
        <div class="menu-category">Bermain Game</div>
        <div class="sidebar-item" onclick="loadPage('blockblast')">🎮 Block Blast</div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="content-area">
        <div class="downloader-card">
            <h2>TikTok Downloader</h2>
            <p>Unduh video TikTok tanpa watermark dengan mudah dan cepat.</p>
            <div class="input-group">
                <input type="text" id="tiktok-url" placeholder="Tempel link video TikTok di sini...">
            </div>
            <button class="download-btn" onclick="startDownload()">Download</button>

            <div id="loading">
                <div class="spinner"></div>
                Sedang memproses video... Mohon tunggu sebentar.
            </div>

            <div id="result-box">
                <p id="video-title" style="font-size: 13px; font-weight: bold; margin-bottom: 5px;"></p>
                <video id="video-player" controls></video>
                <a id="download-link" href="#" target="_blank" style="display: block; margin-top: 10px; padding: 10px; background: #22c55e; color: #fff; text-align: center; border-radius: 8px; text-decoration: none; font-weight: bold;">Simpan Video ke Galeri</a>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <a class="nav-item active" onclick="switchTab(this, 'Beranda')">🏠<span>Beranda</span></a>
        <a class="nav-item" onclick="switchTab(this, 'Kotak Masuk')">📥<span>Kotak Masuk</span></a>
        <a class="nav-item" onclick="switchTab(this, 'Profile')">👤<span>Profile</span></a>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function loadPage(page) {
            toggleSidebar();
            if (page === 'tiktok') {
                document.getElementById('page-title').innerText = 'TikTok Downloader';
            } else {
                alert('Fitur sedang dalam perbaikan / akan segera hadir!');
            }
        }

        async function startDownload() {
            const url = document.getElementById('tiktok-url').value;
            if (!url) {
                alert('Silakan masukkan link TikTok terlebih dahulu!');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result-box').style.display = 'none';

            try {
                const response = await fetch('/api/download-tiktok', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const resData = await response.json();

                document.getElementById('loading').style.display = 'none';

                if (resData.success) {
                    const data = resData.data;
                    document.getElementById('video-title').innerText = data.title || 'Video TikTok';
                    document.getElementById('video-player').src = data.video || data.data;
                    document.getElementById('download-link').href = data.video || data.data;
                    document.getElementById('result-box').style.display = 'block';
                } else {
                    alert('Gagal mendownload video. Pastikan link valid!');
                }
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                Terjadi kesalahan pada server.
            }
        }

        function switchTab(element, name) {
            let items = document.querySelectorAll('.bottom-nav .nav-item');
            items.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            if (name !== 'Beranda') {
                alert(`Menu ${name} sedang dalam perbaikan / fitur mendatang!`);
            }
        }
    </script>
</body>
</html>
