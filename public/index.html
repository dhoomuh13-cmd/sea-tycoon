<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Tycoon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .content {
            text-align: center;
            padding: 20px;
            margin-bottom: 60px;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 340px;
        }
        /* Navigasi Bawah */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #334155;
        }
        .nav-item {
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            color: #38bdf8;
        }
        /* Modal Notifikasi */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            max-width: 280px;
            border: 1px solid #334155;
        }
        .modal-content button {
            margin-top: 15px;
            padding: 8px 16px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="content">
        <div class="card">
            <h2>Selamat Datang! 🎉</h2>
            <p style="margin-top: 10px; color: #94a3b8; font-size: 14px;">Akunmu berhasil terhubung ke database. Silakan gunakan menu di bawah untuk menjelajahi aplikasi.</p>
        </div>
    </div>

    <!-- Navigasi Bawah -->
    <div class="bottom-nav">
        <a class="nav-item active" onclick="showPopup('Beranda')">🏠<span>Beranda</span></a>
        <a class="nav-item" onclick="showPopup('Status')">📊<span>Status</span></a>
        <a class="nav-item" onclick="showPopup('Settings')">⚙️<span>Settings</span></a>
        <a class="nav-item" onclick="showPopup('Profile')">👤<span>Profile</span></a>
    </div>

    <!-- Modal Popup Pemberitahuan -->
    <div id="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-bottom: 8px;">Informasi</h3>
            <p id="modal-text" style="color: #94a3b8; font-size: 13px;">Fitur sedang dalam perbaikan / akan segera hadir!</p>
            <button onclick="closePopup()">Tutup</button>
        </div>
    </div>

    <script>
        function showPopup(menu) {
            if (menu === 'Beranda') {
                return; // Beranda aman
            }
            document.getElementById('modal-text').innerText = `Menu ${menu} sedang dalam perbaikan / fitur mendatang!`;
            document.getElementById('modal').style.display = 'flex';
        }
        function closePopup() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
