<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Santai - Beranda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1c29, #2b3a4a);
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Kartu Utama (Login) */
        .auth-card {
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 10;
            transition: 0.3s;
        }

        .logo-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .auth-card h2 {
            color: #1e293b;
            margin-bottom: 6px;
            font-size: 22px;
        }

        .auth-card p {
            color: #64748b;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .btn-social {
            width: 100%;
            padding: 11px;
            background: #f8fafc;
            color: #334155;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .btn-social:hover {
            background: #f1f5f9;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin: 20px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider span {
            padding: 0 10px;
        }

        .input-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            color: #1e293b;
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #8b5cf6;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        /* Halaman Utama (Dashboard setelah masuk) */
        #dashboard {
            display: none;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 10;
            position: relative;
        }

        /* Tombol Titik Tiga (Hamburger Menu) */
        .menu-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #334155;
            transition: 0.2s;
        }

        .menu-btn:hover {
            background: #e2e8f0;
        }

        /* Kotak Dropdown Titik Tiga */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 60px;
            right: 20px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 180px;
            text-align: left;
            z-index: 100;
            overflow: hidden;
        }

        .dropdown-menu button {
            width: 100%;
            padding: 12px 16px;
            background: none;
            border: none;
            text-align: left;
            font-size: 13px;
            color: #334155;
            cursor: pointer;
            transition: 0.2s;
        }

        .dropdown-menu button:hover {
            background: #f8fafc;
            color: #8b5cf6;
        }

        /* Efek Gelembung Air saat Klik */
        .click-bubble {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.7);
            background: rgba(139, 92, 246, 0.25);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: popBubble 0.6s ease-out forwards;
            z-index: 999;
        }

        @keyframes popBubble {
            0% { width: 10px; height: 10px; opacity: 1; }
            100% { width: 90px; height: 90px; opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- KARTU LOGIN / REGISTER -->
    <div class="auth-card" id="authCard">
        <div class="logo-icon">✨</div>
        <h2>Halo, Pendatang Baru!</h2>
        <p>Buat akun dan nikmati ruang santaimu</p>
        
        <button class="btn-social" onclick="simulateLogin()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.22 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7c0 1.83.43 3.58 1.19 5.12l4.09-2.55z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
            Google
        </button>

        <div class="divider">
            <span>atau daftar dengan email</span>
        </div>

        <form onsubmit="event.preventDefault(); simulateLogin();">
            <div class="input-group">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-submit">Daftar Sekarang</button>
        </form>
    </div>

    <!-- KARTU HALAMAN UTAMA (DASHBOARD) -->
    <div id="dashboard">
        <!-- Tombol Titik Tiga -->
        <button class="menu-btn" onclick="toggleMenu(event)">⋮</button>
        
        <!-- Menu Dropdown -->
        <div class="dropdown-menu" id="dropdownMenu">
            <button onclick="alert('Membuka Mini Game Santai!')">🎮 Mini Game</button>
            <button onclick="alert('Memutar Suara Ambient!')">🎧 Ruang Musik</button>
            <button onclick="alert('Membuka Dinding Pesan!')">💬 Dinding Pesan</button>
            <button onclick="alert('Melihat Profil Pengguna!')">👤 Profil Saya</button>
        </div>

        <div style="font-size: 40px; margin-bottom: 15px;">🎉</div>
        <h2 style="color: #1e293b; margin-bottom: 8px;">Selamat Datang di Ruang Santai!</h2>
        <p style="color: #64748b; font-size: 13px;">Akunmu berhasil terhubung ke database. Silakan klik ikon titik tiga di pojok kanan atas untuk mencoba fitur-fiturnya.</p>
    </div>

    <script>
        // Simulasi pindah dari halaman login ke dashboard
        function simulateLogin() {
            document.getElementById('authCard').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }

        // Fungsi buka/tutup menu titik tiga
        function toggleMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // Tutup menu jika klik di luar area menu
        window.addEventListener('click', () => {
            document.getElementById('dropdownMenu').style.display = 'none';
        });

        // Efek gelembung air saat layar diklik
        window.addEventListener('click', (e) => {
            const bubble = document.createElement('div');
            bubble.classList.add('click-bubble');
            bubble.style.left = `${e.clientX}px`;
            bubble.style.top = `${e.clientY}px`;
            document.body.appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
            }, 600);
        });
    </script>
</body>
</html>
