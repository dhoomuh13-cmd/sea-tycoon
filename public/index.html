<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Block Me - Cari Teman Palsumu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #4ea8de 0%, #90e0ef 60%, #caf0f8 100%);
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* Efek kertas bergaris untuk loading */
        .paper-bg {
            background-color: #ffffff;
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 26px;
        }

        /* Animasi Teks Bergerak / Berdenyut */
        @keyframes bounceGlow {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-5px) scale(1.02); }
        }
        .animate-pop {
            animation: bounceGlow 2s ease-in-out infinite;
        }

        /* Efek Gradasi Teks ala iPhone */
        .gradient-text-1 {
            background: linear-gradient(135deg, #ff4f8b 0%, #ff70a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-text-2 {
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Animasi Transisi Halaman yang Mulus (Slide & Fade) */
        .fade-out {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
        }

        .screen {
            position: absolute;
            width: 100%;
            max-width: 24rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .screen.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: relative;
        }

        .menu-hidden {
            opacity: 0;
            transform: scale(0.95) translateY(-10px);
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative">

    <!-- ========================================== -->
    <!-- 1. LAYAR LOADING (KERTAS BERGARIS) -->
    <!-- ========================================== -->
    <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-4 bg-gradient-to-b from-[#4ea8de] to-[#90e0ef]">
        <div class="relative mb-6 text-center">
            <div class="flex justify-center gap-12 mb-[-12px] relative z-10">
                <span class="text-3xl animate-bounce">🧸</span>
                <span class="text-3xl animate-bounce" style="animation-delay: 0.2s;">🐼</span>
            </div>
            <div class="bg-white/90 backdrop-blur-md px-6 py-2.5 rounded-3xl shadow-lg border border-white">
                <h1 class="text-3xl font-black tracking-wide">
                    <span class="gradient-text-1">Don't</span> <span class="gradient-text-2">Block</span> <span class="gradient-text-1">Me</span>
                </h1>
            </div>
        </div>

        <div class="w-full max-w-xs paper-bg rounded-[28px] p-8 shadow-2xl relative border-2 border-slate-100 transform rotate-1">
            <div class="absolute -top-3 -left-4 w-14 h-6 bg-pink-300/90 rotate-[-12deg] shadow-sm rounded-sm"></div>
            <div class="absolute top-4 right-4 text-pink-500 text-xl">❤️</div>
            <div class="absolute bottom-4 left-4 text-yellow-400 text-xl">⭐</div>

            <div class="text-center my-6">
                <p class="text-2xl font-black text-slate-800 tracking-wide">
                    loading<span id="loading-dots">...</span>
                </p>
                <div class="flex justify-center items-center gap-2.5 mt-5">
                    <span class="w-3.5 h-3.5 bg-blue-500 rounded-full animate-bounce shadow-sm"></span>
                    <span class="w-3.5 h-3.5 bg-pink-500 rounded-full animate-bounce shadow-sm" style="animation-delay: 0.2s;"></span>
                    <span class="w-3.5 h-3.5 bg-yellow-400 rounded-full animate-bounce shadow-sm" style="animation-delay: 0.4s;"></span>
                </div>
            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 2. HALAMAN UTAMA (MENU AWAL) -->
    <!-- ========================================== -->
    <div id="main-screen" class="screen active text-center pt-4">
        
        <div class="absolute -top-2 left-1 text-4xl animate-bounce z-20">🧸</div>
        <div class="absolute top-0 right-1 text-4xl animate-bounce z-20" style="animation-delay: 0.2s;">🐼</div>

        <!-- Header / Logo Utama -->
        <div class="relative mb-5 w-full bg-white/90 backdrop-blur-md pt-5 pb-4 rounded-[32px] shadow-xl border-2 border-white">
            <h1 class="text-4xl sm:text-5xl font-black tracking-wide leading-tight drop-shadow-sm">
                <span class="gradient-text-1">Don't</span> <br>
                <span class="gradient-text-2">Block</span> <span class="gradient-text-1">Me</span>
            </h1>
            
            <div class="inline-block mt-3 bg-white px-5 py-1.5 rounded-full shadow-sm border border-pink-100">
                <p id="txt-subtitle" class="text-xs sm:text-sm font-extrabold text-slate-600 tracking-wider">Cari Teman Palsumu</p>
            </div>
        </div>

        <!-- TOMBOL & MENU DROPDOWN PILIHAN BAHASA -->
        <div class="relative mb-5 w-full">
            <div onclick="toggleLangMenu()" class="bg-white rounded-full p-3.5 shadow-md flex items-center justify-between px-6 border-2 border-pink-100 cursor-pointer hover:border-pink-300 transition active:scale-95">
                <div class="flex items-center gap-2.5">
                    <span class="text-xl">🌐</span>
                    <span id="selected-lang" class="font-extrabold text-slate-800 text-sm">Indonesia</span>
                </div>
                <div id="lang-arrow" class="bg-[#ff4f8b] text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-black shadow-sm transition-transform duration-300">
                    ▼
                </div>
            </div>

            <div id="lang-menu" class="absolute top-16 left-0 right-0 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border-2 border-pink-100 p-2 z-30 menu-hidden flex flex-col gap-1.5">
                <div onclick="changeLanguage('Indonesia', 'Cari Teman Palsumu', 'buat kuismu', 'blokir teman palsumu', 'Mulai Buat Kuis 🚀')" class="flex items-center justify-between px-4 py-2.5 rounded-xl hover:bg-pink-50 cursor-pointer transition">
                    <span class="font-extrabold text-slate-800 text-sm">🇮🇩 Indonesia (Utama)</span>
                    <span class="text-pink-500 font-bold text-xs">✓</span>
                </div>
                <div onclick="changeLanguage('English', 'Find Your Fake Friends', 'create your quiz', 'block your fake friends', 'Start Creating Quiz 🚀')" class="flex items-center justify-between px-4 py-2.5 rounded-xl hover:bg-pink-50 cursor-pointer transition">
                    <span class="font-extrabold text-slate-700 text-sm">🇬🇧 English</span>
                </div>
            </div>
        </div>

        <!-- Card Konten Utama -->
        <div class="bg-white rounded-[32px] p-6 shadow-2xl border-[3px] border-dashed border-pink-200 relative w-full">
            <div class="absolute -top-3 -right-2 bg-white p-2 rounded-full shadow-md border border-pink-100">
                <span class="text-xl">💖</span>
            </div>

            <div class="flex justify-center items-center mb-4">
                <div class="bg-gradient-to-r from-pink-50 via-sky-50 to-yellow-50 px-6 py-3 rounded-2xl border border-pink-100 shadow-inner animate-pop">
                    <p class="text-xs font-black tracking-widest text-pink-600 uppercase">Dev • DhooCep</p>
                    <p class="text-base font-black text-slate-900 tracking-wide mt-0.5">BlockDay ✨</p>
                </div>
            </div>
            
            <h2 id="txt-content" class="text-xl sm:text-2xl font-black text-slate-900 leading-snug tracking-tight">
                buat kuismu <br> 
                <span class="text-[#ff4f8b] text-3xl font-black">&</span> <br> 
                <span class="bg-yellow-300 px-3 py-0.5 rounded-lg inline-block mt-1 text-slate-900 shadow-sm font-black transform -rotate-1">blokir</span> teman palsumu
            </h2>

            <!-- Tombol Mulai Kuis (Berpindah ke Halaman Masukkan Nama dengan Animasi) -->
            <button onclick="goToNameScreen()" class="mt-6 w-full bg-gradient-to-r from-[#ff4f8b] to-[#ff2a6d] hover:from-[#e03e77] hover:to-[#d91b5c] text-white font-black py-4 px-6 rounded-2xl shadow-lg shadow-pink-300 transition-all transform active:scale-95 text-base tracking-wide">
                Mulai Buat Kuis 🚀
            </button>
        </div>

        <div class="mt-4 text-xs text-slate-700 font-extrabold drop-shadow-xs">
            ✨ Terhubung dengan MongoDB
        </div>
    </div>


    <!-- ========================================== -->
    <!-- 3. HALAMAN MASUKKAN NAMA (PERSIS REFERENSI) -->
    <!-- ========================================== -->
    <div id="name-screen" class="screen text-center pt-2">
        
        <!-- Header Atas: Tombol Kembali & Bendera Sejajar Rapi -->
        <div class="w-full flex items-center justify-between mb-3 px-1">
            <button onclick="goBackToMain()" class="w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center font-black text-slate-700 border border-pink-100 active:scale-95 transition">
                ❮
            </button>
            <div class="bg-white px-3.5 py-1.5 rounded-full shadow-md border border-pink-100 flex items-center gap-1.5">
                <span class="text-base">🇮🇩</span>
                <span class="w-2 h-2 bg-pink-500 rounded-full"></span>
            </div>
        </div>

        <!-- Logo Kecil dengan Maskot di Atas -->
        <div class="relative mb-4 w-full bg-white/90 backdrop-blur-md pt-3 pb-3 rounded-[28px] shadow-lg border border-white">
            <div class="absolute -top-3 left-6 text-3xl animate-bounce">🧸</div>
            <div class="absolute -top-3 right-6 text-3xl animate-bounce" style="animation-delay: 0.2s;">🐼</div>
            <h1 class="text-2xl font-black">
                <span class="gradient-text-1">Don't</span> <span class="gradient-text-2">Block</span> <span class="gradient-text-1">Me</span>
            </h1>
        </div>

        <!-- Balon Percakapan "siapa namamu?" Miring Estetik & Maskot Panda -->
        <div class="relative w-full my-3 flex justify-center items-center">
            <!-- Gelembung Balon Pink Miring -->
            <div class="bg-pink-100/95 border-2 border-pink-200 px-6 py-4 rounded-[28px] shadow-md relative transform -rotate-2 max-w-[240px]">
                <p class="text-xs font-extrabold text-slate-600 tracking-wider">siapa</p>
                <p class="text-2xl font-black text-[#ff4f8b] tracking-wide">namamu?</p>
                <!-- Ekor Balon Mengarah ke Bawah Kanan -->
                <div class="absolute -bottom-3 right-8 w-4 h-4 bg-pink-100 border-r-2 border-b-2 border-pink-200 transform rotate-45"></div>
            </div>

            <!-- Maskot Panda Imut di Samping Kanan Bawah Balon -->
            <div class="absolute right-4 bottom-0 text-4xl z-20 animate-bounce">🐼</div>
        </div>

        <!-- Kotak Input Nama -->
        <div class="bg-white rounded-[28px] p-5 shadow-xl border-2 border-pink-100 w-full relative mt-2">
            <div class="relative flex items-center">
                <input type="text" id="username-input" maxlength="15" oninput="updateCharCount(this)" placeholder="nama..." class="w-full bg-slate-50 border-2 border-pink-100 focus:border-pink-400 focus:outline-none rounded-2xl py-4 px-4 font-extrabold text-slate-800 placeholder-slate-400 text-base shadow-inner">
                <span id="char-count" class="absolute right-4 text-xs font-bold text-slate-400">0/15</span>
            </div>

            <!-- Tombol Lanjut -->
            <button onclick="submitName()" class="mt-4 w-full bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-500 hover:to-blue-600 text-white font-black py-4 px-6 rounded-2xl shadow-lg shadow-blue-200 transition-all transform active:scale-95 text-base tracking-wide flex items-center justify-center gap-2">
                <span>lanjut</span> <span class="text-lg">➔</span>
            </button>
        </div>

    </div>


    <script>
        // Durasi loading 6 detik, lalu masuk ke menu utama dengan transisi halus
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                const mainScreen = document.getElementById('main-screen');

                loadingScreen.classList.add('fade-out');
                mainScreen.classList.add('active');
            }, 6000); 
        });

        // Buka/Tutup Menu Bahasa
        function toggleLangMenu() {
            const menu = document.getElementById('lang-menu');
            const arrow = document.getElementById('lang-arrow');
            
            if (menu.classList.contains('menu-hidden')) {
                menu.classList.remove('menu-hidden');
                menu.classList.add('menu-show');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                menu.classList.remove('menu-show');
                menu.classList.add('menu-hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        // Ganti Bahasa
        function changeLanguage(langName, subtitleText, actionText1, actionText2, buttonText) {
            document.getElementById('selected-lang').innerText = langName;
            document.getElementById('txt-subtitle').innerText = subtitleText;
            
            const contentEl = document.getElementById('txt-content');
            if (langName === 'English') {
                contentEl.innerHTML = `create your quiz <br> <span class="text-[#ff4f8b] text-3xl font-black">&</span> <br> <span class="bg-yellow-300 px-3 py-0.5 rounded-lg inline-block mt-1 text-slate-900 shadow-sm font-black transform -rotate-1">block</span> your fake friends`;
            } else {
                contentEl.innerHTML = `buat kuismu <br> <span class="text-[#ff4f8b] text-3xl font-black">&</span> <br> <span class="bg-yellow-300 px-3 py-0.5 rounded-lg inline-block mt-1 text-slate-900 shadow-sm font-black transform -rotate-1">blokir</span> teman palsumu`;
            }
            toggleLangMenu();
        }

        // Berpindah ke Halaman Masukkan Nama dengan Efek Mulus (Slide Up)
        function goToNameScreen() {
            const mainScreen = document.getElementById('main-screen');
            const nameScreen = document.getElementById('name-screen');

            mainScreen.classList.remove('active');
            nameScreen.classList.add('active');
        }

        // Kembali ke Menu Utama
        function goBackToMain() {
            const mainScreen = document.getElementById('main-screen');
            const nameScreen = document.getElementById('name-screen');

            nameScreen.classList.remove('active');
            mainScreen.classList.add('active');
        }

        // Hitung Karakter Input Nama (0/15)
        function updateCharCount(input) {
            const count = input.value.length;
            document.getElementById('char-count').innerText = `${count}/15`;
        }

        // Aksi Ketika Klik Lanjut
        function submitName() {
            const name = document.getElementById('username-input').value.trim();
            if (!name) {
                alert('Silakan masukkan nama kamu terlebih dahulu!');
                return;
            }
            alert(`Halo ${name}! Siap membuat kuis dan melacak teman palsumu.`);
        }
    </script>
</body>
</html>
