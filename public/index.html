<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Block Me - Cari Teman Palsumu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap');
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #b9e3fc 100%);
        }
        
        /* Animasi Berdenyut / Goyang untuk Teks Kreatif */
        @keyframes floatText {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.03); }
        }
        .animate-float {
            animation: floatText 2.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Container Utama -->
    <div class="w-full max-w-sm text-center relative pt-8">
        
        <!-- Maskot Beruang & Panda di Atas Card Judul -->
        <div class="absolute -top-1 left-2 text-4xl animate-bounce z-20">🧸</div>
        <div class="absolute top-1 right-2 text-4xl animate-bounce z-20" style="animation-delay: 0.2s;">🐼</div>

        <!-- Header / Logo -->
        <div class="relative mb-5 bg-white/70 backdrop-blur-md pt-5 pb-4 rounded-[32px] shadow-lg border border-white">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-[#ff4f8b] tracking-wide leading-tight drop-shadow-sm">
                Don't <br>
                <span class="text-[#3b82f6]">Block</span> Me
            </h1>
            
            <!-- Subtitle Banner -->
            <div class="inline-block mt-3 bg-white px-5 py-1 rounded-full shadow-sm border border-blue-100">
                <p class="text-xs sm:text-sm font-bold text-slate-600 tracking-wider">Cari Teman Palsumu</p>
            </div>
        </div>

        <!-- Tombol Pilihan Bahasa -->
        <div class="bg-white rounded-full p-3 shadow-md flex items-center justify-between mb-5 px-5 border-2 border-pink-100 cursor-pointer hover:border-pink-300 transition">
            <div class="flex items-center gap-2.5">
                <span class="text-xl">🌐</span>
                <span class="font-bold text-slate-700 text-sm">Indonesia</span>
            </div>
            <div class="bg-[#ff4f8b] text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-sm">
                ▼
            </div>
        </div>

        <!-- Card Konten Utama (Garis Putus-putus) -->
        <div class="bg-white rounded-[32px] p-6 shadow-xl border-[3px] border-dashed border-pink-200 relative">
            
            <!-- Ikon Hati Melayang -->
            <div class="absolute -top-3 -right-2 bg-white p-2 rounded-full shadow-md border border-pink-100">
                <span class="text-xl">💖</span>
            </div>

            <!-- Teks Animasi Bergerak Pengganti Gambar (Dev DhooCep BlockDay) -->
            <div class="flex justify-center items-center mb-4">
                <div class="bg-gradient-to-r from-pink-50 via-sky-50 to-yellow-50 px-5 py-3 rounded-2xl border border-pink-100 shadow-inner animate-float">
                    <p class="text-xs font-bold tracking-widest text-pink-500 uppercase">Dev • DhooCep</p>
                    <p class="text-base font-extrabold text-slate-800 tracking-wide mt-0.5">BlockDay ✨</p>
                </div>
            </div>
            
            <!-- Teks Ajakan -->
            <h2 class="text-lg sm:text-xl font-extrabold text-slate-800 leading-snug">
                buat kuismu <br> 
                <span class="text-[#ff4f8b] text-2xl">&</span> <br> 
                <span class="bg-yellow-200 px-2.5 py-0.5 rounded-md inline-block mt-1 text-slate-900 shadow-xs">blokir</span> teman palsumu
            </h2>

            <!-- Tombol Aksi Utama -->
            <button onclick="mulaiKuis()" class="mt-6 w-full bg-gradient-to-r from-[#ff4f8b] to-[#ff2a6d] hover:from-[#e03e77] hover:to-[#d91b5c] text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-lg shadow-pink-200 transition-all transform active:scale-95">
                Mulai Buat Kuis 🚀
            </button>
        </div>

        <!-- Footer Kecil -->
        <div class="mt-4 text-xs text-slate-500 font-medium">
            ✨ Terhubung dengan MongoDB
        </div>

    </div>

    <script>
        function mulaiKuis() {
            alert('Tombol mulai diklik! Siap masuk ke halaman pembuatan kuis.');
        }
    </script>
</body>
</html>
